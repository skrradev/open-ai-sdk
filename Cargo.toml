[package]
name = "open_ai_sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A Rust SDK for the OpenAI API."
repository = "https://github.com/openai/open-ai-sdk-rust"
readme = "README.md"
keywords = ["openai", "ai", "sdk", "api", "llm"]
categories = ["api-bindings", "asynchronous"]

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]

[dependencies]
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream"] }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread"] }

[dev-dependencies]
wiremock = "0.6"
